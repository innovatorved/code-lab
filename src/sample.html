<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@innovatorved/code-lab — Standalone IDE Workbench</title>
  <link rel="stylesheet" href="./code-lab.css" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #app .codelab {
      height: 100%;
      max-height: 100%;
      border: none;
      border-radius: 0;
    }
    #app .codelab,
    #app .codelab-workbench {
      width: 100%;
      height: 100%;
      min-height: 100%;
      max-height: 100%;
      border-radius: 0;
      border: none;
    }
  </style>
</head>
<body>
  <!-- Standalone sample UI embedding the <code-lab> workbench -->
  <div id="app"></div>

  <script src="./code-lab.js"></script>
  <script>
    (function () {
      const limiterCode = [
        "/**",
        " * Sliding Window Log Rate Limiter",
        " * Tracks request timestamps within a sliding time window.",
        " */",
        "class SlidingWindowLimiter {",
        "  constructor(limit = 5, windowMs = 10000) {",
        "    this.limit = limit;",
        "    this.windowMs = windowMs;",
        "    this.logs = [];",
        "  }",
        "",
        "  allowRequest(now = Date.now()) {",
        "    const windowStart = now - this.windowMs;",
        "    // Evict timestamps outside the current sliding window",
        "    this.logs = this.logs.filter(timestamp => timestamp > windowStart);",
        "",
        "    if (this.logs.length < this.limit) {",
        "      this.logs.push(now);",
        "      return {",
        "        allowed: true,",
        "        remaining: this.limit - this.logs.length,",
        "        limit: this.limit,",
        "        resetMs: this.logs.length > 0 ? Math.max(0, (this.logs[0] + this.windowMs) - now) : this.windowMs",
        "      };",
        "    }",
        "",
        "    const oldest = this.logs[0];",
        "    const retryAfterMs = Math.max(0, (oldest + this.windowMs) - now);",
        "    return {",
        "      allowed: false,",
        "      remaining: 0,",
        "      limit: this.limit,",
        "      retryAfterMs",
        "    };",
        "  }",
        "",
        "  reset() {",
        "    this.logs = [];",
        "  }",
        "}",
        "",
        "module.exports = { SlidingWindowLimiter, RateLimiter: SlidingWindowLimiter };"
      ].join('\n');

      const serverCode = [
        "const http = require('node:http');",
        "const { SlidingWindowLimiter } = require('./limiter');",
        "",
        "const limiters = new Map();",
        "",
        "function getLimiter(clientKey) {",
        "  if (!limiters.has(clientKey)) {",
        "    // 5 requests per 10-second sliding window",
        "    limiters.set(clientKey, new SlidingWindowLimiter(5, 10000));",
        "  }",
        "  return limiters.get(clientKey);",
        "}",
        "",
        "const server = http.createServer((req, res) => {",
        "  const url = new URL(req.url, 'http://localhost:3000');",
        "  const clientKey = url.searchParams.get('client') || 'anonymous';",
        "  const limiter = getLimiter(clientKey);",
        "  const decision = limiter.allowRequest();",
        "",
        "  if (url.pathname === '/health') {",
        "    res.writeHead(200, { 'Content-Type': 'application/json' });",
        "    res.end(JSON.stringify({ status: 'ok', uptime: process.uptime() }));",
        "    return;",
        "  }",
        "",
        "  if (decision.allowed) {",
        "    res.writeHead(200, {",
        "      'Content-Type': 'application/json',",
        "      'X-RateLimit-Limit': String(decision.limit),",
        "      'X-RateLimit-Remaining': String(decision.remaining)",
        "    });",
        "    res.end(JSON.stringify({",
        "      status: 'success',",
        "      client: clientKey,",
        "      message: 'Request allowed by sliding window limiter',",
        "      remaining: decision.remaining",
        "    }, null, 2));",
        "  } else {",
        "    res.writeHead(429, {",
        "      'Content-Type': 'application/json',",
        "      'Retry-After': String(Math.ceil(decision.retryAfterMs / 1000)),",
        "      'X-RateLimit-Limit': String(decision.limit),",
        "      'X-RateLimit-Remaining': '0'",
        "    });",
        "    res.end(JSON.stringify({",
        "      status: 'rate_limited',",
        "      client: clientKey,",
        "      error: 'Too Many Requests',",
        "      retryAfterMs: decision.retryAfterMs",
        "    }, null, 2));",
        "  }",
        "});",
        "",
        "server.listen(3000, () => {",
        "  console.log('Sliding Window Rate Limiter HTTP Server listening on http://localhost:3000');",
        "  console.log('Available endpoints:');",
        "  console.log('  curl http://localhost:3000/');",
        "  console.log('  curl \"http://localhost:3000/?client=user_1\"');",
        "  console.log('  curl http://localhost:3000/health');",
        "});"
      ].join('\n');

      const demoCode = [
        "const { SlidingWindowLimiter } = require('./limiter');",
        "",
        "console.log('=== Sliding Window Rate Limiter Demo ===\\n');",
        "",
        "const limiter = new SlidingWindowLimiter(3, 2000); // 3 requests per 2-second window",
        "const baseTime = 10000;",
        "",
        "console.log('Configuration: Limit = 3 requests per 2000ms window\\n');",
        "",
        "for (let i = 1; i <= 5; i++) {",
        "  const now = baseTime + (i * 100);",
        "  const decision = limiter.allowRequest(now);",
        "  const status = decision.allowed",
        "    ? ('ALLOWED  (remaining: ' + decision.remaining + ')')",
        "    : ('BLOCKED  (retryAfter: ' + decision.retryAfterMs + 'ms)');",
        "  console.log('[Req #' + i + '] t = ' + now + 'ms -> ' + status);",
        "}",
        "",
        "console.log('\\n--- Advancing time past window expiration (+2500ms) ---');",
        "const afterExpiry = limiter.allowRequest(baseTime + 2500);",
        "console.log('[Req #6] t = ' + (baseTime + 2500) + 'ms -> ' + (afterExpiry.allowed ? ('ALLOWED  (remaining: ' + afterExpiry.remaining + ')') : 'BLOCKED'));",
        "",
        "console.log('\\nDemo completed successfully. Run unit tests with `npm test` or start HTTP server with `node server.js &`.');"
      ].join('\n');

      const testCode = [
        "const { test, describe } = require('node:test');",
        "const assert = require('node:assert/strict');",
        "const { SlidingWindowLimiter } = require('./limiter');",
        "",
        "describe('SlidingWindowLimiter', () => {",
        "  test('allows requests up to capacity limit', () => {",
        "    const limiter = new SlidingWindowLimiter(3, 5000);",
        "    const t0 = 1000;",
        "    assert.equal(limiter.allowRequest(t0).allowed, true);",
        "    assert.equal(limiter.allowRequest(t0 + 100).allowed, true);",
        "    assert.equal(limiter.allowRequest(t0 + 200).allowed, true);",
        "  });",
        "",
        "  test('rejects requests when limit is exceeded within the same window', () => {",
        "    const limiter = new SlidingWindowLimiter(2, 5000);",
        "    const t0 = 1000;",
        "    assert.equal(limiter.allowRequest(t0).allowed, true);",
        "    assert.equal(limiter.allowRequest(t0 + 10).allowed, true);",
        "    const rejected = limiter.allowRequest(t0 + 20);",
        "    assert.equal(rejected.allowed, false);",
        "    assert.equal(rejected.remaining, 0);",
        "    assert.ok(rejected.retryAfterMs > 0);",
        "  });",
        "",
        "  test('slides window and re-allows requests as oldest timestamps expire', () => {",
        "    const limiter = new SlidingWindowLimiter(2, 1000);",
        "    const t0 = 1000;",
        "    assert.equal(limiter.allowRequest(t0).allowed, true);",
        "    assert.equal(limiter.allowRequest(t0 + 200).allowed, true);",
        "    assert.equal(limiter.allowRequest(t0 + 400).allowed, false);",
        "",
        "    // Oldest request at t0 expires at t0 + 1000 = 2000. At 2050, 1 slot is free.",
        "    const res = limiter.allowRequest(2050);",
        "    assert.equal(res.allowed, true);",
        "    assert.equal(res.remaining, 0);",
        "  });",
        "",
        "  test('reset clears internal timestamp log', () => {",
        "    const limiter = new SlidingWindowLimiter(1, 5000);",
        "    limiter.allowRequest(1000);",
        "    assert.equal(limiter.allowRequest(1001).allowed, false);",
        "    limiter.reset();",
        "    assert.equal(limiter.allowRequest(1002).allowed, true);",
        "  });",
        "});"
      ].join('\n');

      const readmeContent = [
        "# Sliding Window Rate Limiter & Virtual HTTP Gateway",
        "",
        "This standalone interactive IDE runs entirely inside your browser using `@innovatorved/code-lab` with zero remote asset dependencies.",
        "",
        "## Architecture",
        "- **In-Memory POSIX Web Worker**: Full VFS and Node.js-compatible execution context.",
        "- **PTY Terminal Emulator**: Interactive shell with ANSI colors, command history, and piping.",
        "- **Virtual HTTP Loopback**: In-memory TCP/HTTP socket routing and real-time Port inspection.",
        "",
        "## Quick Start",
        "1. Click **Run Demo** in the top toolbar or run:",
        "   ```bash",
        "   node demo.js",
        "   ```",
        "2. Run automated unit tests with **Run Tests** or run:",
        "   ```bash",
        "   node test.js",
        "   ```",
        "3. Start the virtual HTTP server in the background:",
        "   ```bash",
        "   node server.js &",
        "   ```",
        "4. Query the server via curl or test rate limiting:",
        "   ```bash",
        "   curl http://localhost:3000/",
        "   curl \"http://localhost:3000/?client=alice\"",
        "   curl http://localhost:3000/health",
        "   ```",
        "5. Switch to the **Ports** tab in the bottom drawer to view open listening ports and send requests using the built-in Mini HTTP Client."
      ].join('\n');

      const packageJsonContent = JSON.stringify({
        name: "sliding-window-rate-limiter",
        version: "1.0.0",
        description: "Sliding window rate limiter with virtual HTTP server",
        main: "server.js",
        scripts: {
          start: "node server.js",
          demo: "node demo.js",
          test: "node --test test.js"
        }
      }, null, 2);

      const workbench = CodeLab.mount('#app', {
        id: 'code-lab-standalone-sample',
        title: '@innovatorved/code-lab — Standalone IDE',
        summary: 'Interactive in-browser IDE with virtual POSIX shell, Web Worker runtime, and HTTP loopback.',
        mode: 'sandbox',
        language: 'js',
        entry: 'demo.js',
        testEntry: 'test.js',
        files: {
          'limiter.js': limiterCode,
          'server.js': serverCode,
          'demo.js': demoCode,
          'test.js': testCode,
          'README.md': readmeContent,
          'package.json': packageJsonContent
        }
      });

      if (workbench && typeof workbench.switchDrawerTab === 'function') {
        workbench.switchDrawerTab('terminal');
      }

      window.workbench = workbench;
    })();
  </script>
</body>
</html>
