name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # `npx`/`npm` are used by tools/bundle.js and by the e2e typecheck test.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test (all suites)
        run: bun run tests/run-all.js

      - name: Verify publishable package
        run: bun run pack:check

      - name: Verify a clean rebuild is reproducible
        run: |
          find dist examples/cloud-ide/public/dist -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > /tmp/build-first.sha
          rm -rf dist examples/cloud-ide/public/dist
          bun run build
          find dist examples/cloud-ide/public/dist -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > /tmp/build-second.sha
          diff -u /tmp/build-first.sha /tmp/build-second.sha

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        run: bunx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
