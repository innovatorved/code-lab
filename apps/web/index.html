<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodeLab — Browser-Native Modular IDE &amp; SQL Playground</title>
    <link rel="stylesheet" href="../../dist/code-lab.css" />
    <link rel="stylesheet" href="../../dist/code-lab-sql.css" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #050505;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #ide-shell {
        height: 100vh;
        width: 100vw;
      }
    </style>
  </head>
  <body>
    <div id="ide-shell"></div>
    <script src="../../dist/code-lab.js"></script>
    <script>
      window.workbench = new window.CodeLabWorkbench(document.getElementById('ide-shell'), {
        id: 'codelab-web-shell',
        title: 'CodeLab Modular Workspace',
        files: {
          'index.ts': "const greeting: string = 'Hello from CodeLab v0.4.0!';\nconsole.log(greeting);\n",
          '.codelab/settings.json': '{\n  // Live workspace configuration\n  "editor.fontSize": 14,\n  "editor.tabSize": 2,\n  "workbench.colorTheme": "dark"\n}\n'
        }
      });
    </script>
  </body>
</html>
